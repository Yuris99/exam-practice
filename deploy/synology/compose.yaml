name: exam-practice

services:
  app:
    image: ghcr.io/yuris99/exam-practice:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      AI_DAILY_LIMIT: "${AI_DAILY_LIMIT:-20}"
    security_opt:
      - no-new-privileges:true
