name: exam-practice

services:
  app:
    image: ghcr.io/yuris99/exam-practice:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
      AI_DAILY_LIMIT: "${AI_DAILY_LIMIT:-20}"
    security_opt:
      - no-new-privileges:true
