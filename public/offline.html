<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111613" />
    <title>오프라인 · 자격증 문제 연습</title>
    <style>
      :root{color-scheme:dark}*{box-sizing:border-box}body{display:grid;min-height:100dvh;margin:0;padding:24px;place-items:center;color:#e4ebe5;background:#111613;font-family:system-ui,sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #344139;border-radius:22px;background:#1b231e;text-align:center}.icon{display:grid;width:58px;height:58px;margin:0 auto 16px;place-items:center;border-radius:18px;color:#fff;background:#315f46;font-size:28px;font-weight:900}h1{margin:0 0 8px;font-size:22px}p{margin:0 0 18px;color:#9aa69e;font-size:13px;line-height:1.6}button{min-height:44px;padding:0 18px;border:0;border-radius:12px;color:#fff;background:#315f46;font:inherit;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="icon">✓</div><h1>현재 오프라인입니다</h1><p>연결이 복구되면 다시 시도해 주세요. 이미 저장한 답안과 학습 기록은 이 기기에 그대로 남아 있습니다.</p><button onclick="location.reload()">다시 연결하기</button></main></body>
</html>
